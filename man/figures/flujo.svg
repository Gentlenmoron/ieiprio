<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Flujo de trabajo de ieiprio">
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475467"/>
    </marker>
  </defs>
  <rect width="960" height="340" rx="12" fill="#ffffff"/>

  <g font-size="12" fill="#344054">
    <text x="24" y="34" font-size="11" font-weight="600" fill="#667085" letter-spacing="1">ENTRADA</text>
