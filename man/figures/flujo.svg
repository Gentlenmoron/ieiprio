    <text x="109" y="71" text-anchor="middle" font-weight="600" fill="#0b2545">VCF</text>
    <text x="109" y="89" text-anchor="middle" font-size="11">iei_leer_vcf()</text>
    <rect x="24" y="116" width="170" height="54" rx="8" fill="#eef4fb" stroke="#1d6fa5"/>
    <text x="109" y="139" text-anchor="middle" font-weight="600" fill="#0b2545">Sanger .ab1 .scf FASTA</text>
    <text x="109" y="157" text-anchor="middle" font-size="11">iei_sanger()</text>
    <rect x="24" y="184" width="170" height="54" rx="8" fill="#eef4fb" stroke="#1d6fa5"/>
    <text x="109" y="207" text-anchor="middle" font-weight="600" fill="#0b2545">PDF, Word o texto</text>
    <text x="109" y="225" text-anchor="middle" font-size="11">iei_variantes()</text>
  </g>

  <g stroke="#475467" stroke-width="1.4" fill="none" marker-end="url(#f)">
    <path d="M194 75 C220 75 220 143 246 143"/>
    <path d="M194 143 L246 143"/>
    <path d="M194 211 C220 211 220 143 246 143"/>
    <path d="M396 143 L428 143"/>
    <path d="M578 143 L610 143"/>
    <path d="M760 143 L792 143"/>
  </g>

  <g font-size="12" fill="#344054">
    <text x="248" y="34" font-size="11" font-weight="600" fill="#667085" letter-spacing="1">PROCESO</text>
    <rect x="248" y="104" width="148" height="78" rx="8" fill="#0b2545"/>
    <text x="322" y="134" text-anchor="middle" font-weight="600" fill="#ffffff">Filtrar</text>
    <text x="322" y="152" text-anchor="middle" font-size="11" fill="#d0d5dd">panel, calidad, sexo</text>
    <text x="322" y="168" text-anchor="middle" font-size="11" fill="#d0d5dd">iei_filtrar() en VCF</text>

    <rect x="430" y="104" width="148" height="78" rx="8" fill="#0b2545"/>
    <text x="504" y="134" text-anchor="middle" font-weight="600" fill="#ffffff">Anotar</text>
    <text x="504" y="152" text-anchor="middle" font-size="11" fill="#d0d5dd">VEP, ClinVar, gnomAD</text>
    <text x="504" y="168" text-anchor="middle" font-size="11" fill="#d0d5dd">iei_anotar()</text>

    <rect x="612" y="104" width="148" height="78" rx="8" fill="#0b2545"/>
    <text x="686" y="134" text-anchor="middle" font-weight="600" fill="#ffffff">Priorizar</text>
    <text x="686" y="152" text-anchor="middle" font-size="11" fill="#d0d5dd">puntaje y ACMG</text>
    <text x="686" y="168" text-anchor="middle" font-size="11" fill="#d0d5dd">iei_priorizar()</text>

    <text x="794" y="34" font-size="11" font-weight="600" fill="#667085" letter-spacing="1">SALIDA</text>
    <rect x="794" y="70" width="142" height="54" rx="8" fill="#ecfdf3" stroke="#12b76a"/>
    <text x="865" y="93" text-anchor="middle" font-weight="600" fill="#054f31">Reporte HTML</text>
    <text x="865" y="111" text-anchor="middle" font-size="11">iei_reporte()</text>
    <rect x="794" y="138" width="142" height="54" rx="8" fill="#ecfdf3" stroke="#12b76a"/>
    <text x="865" y="161" text-anchor="middle" font-weight="600" fill="#054f31">Excel, VCF, JSON</text>
    <text x="865" y="179" text-anchor="middle" font-size="11">iei_exportar()</text>
