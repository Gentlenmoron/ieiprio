    <text x="504" y="283" text-anchor="middle" font-weight="600" fill="#344054">Frecuencia</text>
    <text x="504" y="300" text-anchor="middle">iei_gnomad()</text>
    <rect x="612" y="262" width="148" height="50" rx="8" fill="#f9fafb" stroke="#d0d5dd"/>
    <text x="686" y="283" text-anchor="middle" font-weight="600" fill="#344054">Fenotipo</text>
    <text x="686" y="300" text-anchor="middle">HPO, iei_buscar_fenotipo()</text>
