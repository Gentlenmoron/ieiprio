# Pruebas contra los servicios reales (Ensembl, NCBI, gnomAD, PanelApp),
# una vez por semana y a pedido. Detectan a tiempo si una API cambia de
# formato. Una caida temporal de un servicio salta la prueba en lugar de
# fallar.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

name: pruebas-en-vivo

permissions: read-all

jobs:
  en-vivo:
    runs-on: ubuntu-24.04
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      IEIPRIO_EN_VIVO: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools
          needs: check
      - name: Pruebas en vivo
        run: |
          options(ieiprio.silenciar_privacidad = TRUE)
          res <- devtools::test(reporter = c("summary", "fail"))
        shell: Rscript {0}
